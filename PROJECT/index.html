<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Open Sans', 'Open Sans Fallback', sans-serif;
        background-color: #F4F7F9;
        color: #1E293B;
        line-height: 1.6;
    }

    h1,
    h2,
    h3 {
        font-family: 'Montserrat', 'Montserrat Fallback', sans-serif;
        line-height: 1.25;
    }

    .container {
        width: min(1120px, 100% - 2rem);
        margin-inline: auto;
    }

    .site-header {
        background-color: #0B3C5D;
        color: #FFFFFF;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 68px;
        gap: 1rem;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        color: #FFFFFF;
        text-decoration: none;
        font-family: 'Montserrat', 'Montserrat Fallback', sans-serif;
        font-weight: 700;
        font-size: 1.2rem;
    }

    .nav-list {
        list-style: none;
        display: flex;
        gap: 0.5rem;
    }

    .nav-list a {
        display: block;
        padding: 0.5rem 0.9rem;
        color: #FFFFFF;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
    }

    .nav-list a.active,
    .nav-list a:hover {
        background-color: #1D6F8A;
    }

    .hero {
        padding: 2.5rem 0;
    }

    .hero-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 2rem;
        align-items: start;
    }

    .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.8rem;
        font-weight: 600;
        color: #145369;
        margin-bottom: 0.5rem;
    }

    .hero-copy h1 {
        font-size: clamp(1.75rem, 3.2vw, 2.5rem);
        color: #0B3C5D;
        margin-bottom: 0.9rem;
    }

    .hero-copy p {
        color: #475569;
        margin-bottom: 1.4rem;
    }

    .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
    }

    .btn {
        display: inline-block;
        font-family: 'Montserrat', 'Montserrat Fallback', sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        padding: 0.7rem 1.15rem;
        border-radius: 6px;
        border: 2px solid transparent;
        cursor: pointer;
    }

    .btn-primary {
        background-color: #1D6F8A;
        color: #FFFFFF;
    }

    .btn-outline {
        background-color: transparent;
        color: #0B3C5D;
        border-color: #0B3C5D;
    }

    .checker-card {
        background-color: #FFFFFF;
        border: 1px solid #CBD5E1;
        border-radius: 8px;
        padding: 1.5rem;
    }

    @media (max-width: 860px) {
        .hero-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
<link rel="stylesheet" href="styles/main.css" media="print" onload="this.media='all'">
<noscript>
    <link rel="stylesheet" href="styles/main.css">
</noscript>
