<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album - WDD 130</title>
    <meta name="description"
        content="A responsive temple picture album page showcasing various temples with a mobile hamburger menu and dynamic footer.">
    <meta name="author" content="Oke Eduvie">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>
        <div class="header-container">
            <h1>Temple Album</h1>
            <button id="menu" aria-label="Toggle Navigation Menu"></button>
            <nav>
                <ul class="navigation">
                    <li><a href="#" class="active">Home</a></li>
                    <li><a href="#">Old</a></li>
                    <li><a href="#">New</a></li>
                    <li><a href="#">Large</a></li>
                    <li><a href="#">Small</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>Home</h2>
        <div class="grid-container">
            <figure>
                <img src="images/san-diego-california-temple.jpg" alt="San Diego California Temple" width="400"
                    height="300" loading="lazy">
                <figcaption>San Diego California</figcaption>
            </figure>
            <figure>
                <img src="images/salt-lake-temple.jpg" alt="Salt Lake Temple" width="400" height="300" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="images/rome-italy-temple.jpg" alt="Rome Italy Temple" width="400" height="300" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>
            <figure>
                <img src="images/tokyo-japan-temple.jpg" alt="Tokyo Japan Temple" width="400" height="300"
                    loading="lazy">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>
            <figure>
                <img src="images/aba-nigeria-temple.jpg" alt="Aba Nigeria Temple" width="400" height="300"
                    loading="lazy">
                <figcaption>Aba Nigeria Temple</figcaption>
            </figure>
            <figure>
                <img src="images/accra-ghana-temple.jpg" alt="Accra Ghana Temple" width="400" height="300"
                    loading="lazy">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>
            <figure>
                <img src="images/sydney-australia-temple.jpg" alt="Sydney Australia Temple" width="400" height="300"
                    loading="lazy">
                <figcaption>Sydney Australia Temple</figcaption>
            </figure>
            <figure>
                <img src="images/paris-france-temple.jpg" alt="Paris France Temple" width="400" height="300"
                    loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>
            <figure>
                <img src="images/sao-paulo-brazil-temple.jpg" alt="São Paulo Brazil Temple" width="400" height="300"
                    loading="lazy">
                <figcaption>São Paulo Brazil Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Oke Eduvie | Nigeria</p>
        <p id="lastModified">Last Modification: <span id="last-modified"></span></p>
    </footer>
</body>

</html>
